<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chewable Math</title>
<style>
  :root {
    --amber: #F4A82C;
    --amber-deep: #C7740B;
    --ink: #222;
    --muted: #6b6b6b;
    --faint: #9a9a9a;
    --page: #fafafa;
    --card: #ffffff;
    --hair: #e6e6e6;
    --hair-soft: #f0f0f0;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    margin: 0; background: var(--page); color: var(--ink); line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; }

  header { margin-bottom: 8px; }
  .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--amber-deep); font-weight: 700; margin-bottom: 10px; }
  h1 { font-size: 40px; line-height: 1.05; margin: 0 0 12px; letter-spacing: -.02em; }
  .blurb { color: var(--muted); font-size: 15px; max-width: 620px; margin: 0 0 4px; }
  .meta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--hair);
    color: var(--faint); font-size: 13px; }
  .progress { color: var(--amber-deep); font-weight: 600; }

  /* fixed 5-wide rectangle (5 x 8 = 40) */
  .grid { display: grid; gap: 14px; margin-top: 26px; grid-template-columns: repeat(5, 1fr); }
  .tile { position: relative; background: var(--card); border: 1px solid var(--hair);
    border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left;
    padding: 0; font: inherit; color: inherit;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); border-color: #d8d8d8; }
  .tile:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .thumb { position: relative; aspect-ratio: 8 / 9; width: 100%; background: #f6f4ef;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  /* source image = food (left half) + nutrition label (right half).
     Showing the element at 200% width with a matching 16:9 box means the
     left half exactly fills the tile: the label sits off-canvas, cropped away. */
  .thumb img { position: absolute; inset: 0; width: 200%; height: 100%;
    object-fit: cover; object-position: left center; display: block; }
  .num-badge { position: absolute; top: 8px; left: 8px; z-index: 2;
    background: var(--amber); color: #fff; font-weight: 700; font-size: 13px;
    min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .placeholder-num { font-size: 34px; font-weight: 800; color: #d8d3c7; font-variant-numeric: tabular-nums; }
  .tile-name { padding: 10px 12px 12px; font-size: 13px; font-weight: 600; line-height: 1.3; min-height: 44px; }
  .tile.empty { border-style: dashed; background: #fcfbf9; }
  .tile.empty .tile-name { color: var(--faint); font-weight: 500; }

  .overlay { position: fixed; inset: 0; background: rgba(30,26,20,.55);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto; z-index: 50; }
  .overlay.open { display: flex; }
  .sheet { position: relative; background: var(--card); border-radius: 16px;
    max-width: 640px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.28);
    overflow: hidden; animation: pop .16s ease; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  .hero-grid { display: grid; gap: 2px; background: #ece8df; }
  .hero-grid.n1 { grid-template-columns: 1fr; }
  .hero-grid.n2, .hero-grid.n3, .hero-grid.n4 { grid-template-columns: 1fr 1fr; }
  .hero-cell { position: relative; aspect-ratio: 4 / 3; background: #f6f4ef;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .hero-grid.n1 .hero-cell { aspect-ratio: 16 / 9; }
  .hero-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-ph { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; color: #b7b0a2; text-align: center; padding: 10px; }
  .hero-ph .ph-icon { font-size: 28px; line-height: 1; }
  .hero-ph .ph-txt { font-size: 11px; letter-spacing: .03em; }
  .hero-cap { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5);
    color: #fff; font-size: 11px; padding: 5px 8px; text-align: center; letter-spacing: .02em; }
  .no-img { aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; background: #f6f4ef; }

  .close { position: absolute; top: 12px; right: 12px; z-index: 5;
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.92); color: var(--ink); font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .close:hover { background: #fff; }

  .sheet-body { padding: 22px 26px 28px; }
  .sheet-eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--amber-deep); font-weight: 700; margin-bottom: 6px; }
  .sheet-title { font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; line-height: 1.15; }
  .sheet-sub { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--faint);
    text-transform: uppercase; margin: 0 0 18px; }
  ol.questions { margin: 0; padding: 0; list-style: none; counter-reset: q; }
  ol.questions li { counter-increment: q; position: relative;
    padding: 14px 0 14px 40px; border-top: 1px solid var(--hair-soft); font-size: 15px; color: #333; }
  ol.questions li:first-child { border-top: none; }
  ol.questions li::before { content: counter(q); position: absolute; left: 0; top: 13px;
    width: 26px; height: 26px; border-radius: 7px; background: #fbeccb; color: var(--amber-deep);
    font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; }
  ol.questions a { color: var(--amber-deep); }
  .empty-note { padding: 22px 26px 28px; color: var(--muted); font-size: 14px; }
  .empty-note code { background: #f0efe9; padding: 1px 6px; border-radius: 4px; font-size: 12px; }

  .navbtns { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
  .navbtns button { flex: 1; padding: 9px 12px; border: 1px solid var(--hair); background: #fff;
    border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; color: var(--muted); }
  .navbtns button:hover:not(:disabled) { background: #faf8f4; color: var(--ink); border-color: #ddd; }
  .navbtns button:disabled { opacity: .4; cursor: default; }

  @media (prefers-reduced-motion: reduce) { .tile, .sheet { transition: none; animation: none; } }
  @media (max-width: 620px) {
    h1 { font-size: 32px; }
    .grid { grid-template-columns: repeat(3, 1fr); }
    .wrap { padding: 28px 16px 60px; }
  }
  @media (max-width: 400px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="kicker">Chewable Math</div>
    <h1>Forty things worth chewing on</h1>
    <p class="blurb">Real products, real prices, real questions &mdash; each one a small bite of math built around something you'd actually find on a shelf. Click any tile to open it up.</p>
    <div class="meta">
      <span class="progress" id="progress">&mdash;</span>
      <span>&middot;</span>
      <span>Fawn Nguyen</span>
    </div>
  </header>
  <main class="grid" id="grid"></main>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>

[21,22,23,24,25].forEach(n => { if (typeof INLINE!=='undefined' && INLINE[n]) ENTRIES[n].images = [ INLINE[n] ]; });

const TOTAL = 40;

function imgSrc(item)  { return typeof item === 'string' ? item : item.src; }
function isFilled(n)   { const e = ENTRIES[n]; return e && (e.questions || []).length; }
function firstImg(e)   { return e && e.images && e.images.length ? imgSrc(e.images[0]) : ''; }
function escapeHTML(s) { return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function escapeAttr(s) { return escapeHTML(s).replace(/`/g, '&#96;'); }
/* turn bare http(s) URLs inside a question into clickable links */
function linkify(s) {
  return escapeHTML(s).replace(/(https?:\/\/[^\s)]+)/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');
}

function tileImgFail(img, n) { const s = document.createElement('span'); s.className = 'placeholder-num'; s.textContent = n; img.replaceWith(s); }
function heroImgFail(img) { const ph = document.createElement('div'); ph.className = 'hero-ph';
  ph.innerHTML = '<span class="ph-icon">\u25A2</span><span class="ph-txt">image goes here</span>'; img.replaceWith(ph); }

const grid = document.getElementById('grid');
const filledCount = Object.keys(ENTRIES).filter(isFilled).length;
document.getElementById('progress').textContent = filledCount + ' of ' + TOTAL + ' filled in';

for (let n = 1; n <= TOTAL; n++) {
  const e = ENTRIES[n];
  const filled = isFilled(n);
  const src = firstImg(e);
  const thumb = src
    ? '<img src="' + escapeAttr(src) + '" alt="' + escapeAttr((e && e.name) || '') + '" loading="lazy" onerror="tileImgFail(this,' + n + ')">'
    : '<span class="placeholder-num">' + n + '</span>';
  const tile = document.createElement('button');
  tile.className = 'tile' + (filled ? '' : ' empty');
  tile.setAttribute('aria-label', filled ? (n + '. ' + e.name) : ('Entry ' + n + ', not added yet'));
  tile.innerHTML =
    (filled ? '<span class="num-badge">' + n + '</span>' : '') +
    '<div class="thumb">' + thumb + '</div>' +
    '<div class="tile-name">' + (filled ? escapeHTML(e.name) : 'Entry ' + n) + '</div>';
  tile.addEventListener('click', () => openEntry(n));
  grid.appendChild(tile);
}

const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
let current = null;

function hasNext(n) { for (let i = n + 1; i <= TOTAL; i++) if (isFilled(i)) return i; return null; }
function hasPrev(n) { for (let i = n - 1; i >= 1; i--) if (isFilled(i)) return i; return null; }

function heroHTML(e) {
  const imgs = (e && e.images) || [];
  if (!imgs.length) return '<div class="no-img"><span class="placeholder-num">\u2022</span></div>';
  const cells = imgs.map(item => {
    const src = escapeAttr(imgSrc(item));
    const cap = (typeof item === 'string') ? '' : (item.caption || '');
    const capBar = cap ? '<div class="hero-cap">' + escapeHTML(cap) + '</div>' : '';
    return '<div class="hero-cell"><img src="' + src + '" alt="' + escapeAttr(cap) + '" onerror="heroImgFail(this)">' + capBar + '</div>';
  }).join('');
  return '<div class="hero-grid n' + Math.min(imgs.length, 4) + '">' + cells + '</div>';
}

function openEntry(n) {
  current = n;
  const e = ENTRIES[n];
  if (!isFilled(n)) {
    sheet.innerHTML =
      '<button class="close" aria-label="Close">\u00D7</button>' +
      '<div class="no-img"><span class="placeholder-num">' + n + '</span></div>' +
      '<div class="empty-note">Entry <strong>' + n + '</strong> hasn\u2019t been added yet. ' +
      'Drop it into the <code>ENTRIES</code> block at the top of the file.</div>';
  } else {
    const qs = e.questions.map(q => '<li>' + linkify(q) + '</li>').join('');
    const prev = hasPrev(n), next = hasNext(n);
    const sub = e.net ? '<div class="sheet-sub">' + escapeHTML(e.net) + '</div>' : '';
    sheet.innerHTML =
      '<button class="close" aria-label="Close">\u00D7</button>' +
      heroHTML(e) +
      '<div class="sheet-body">' +
        '<div class="sheet-eyebrow">No. ' + n + '</div>' +
        '<h2 class="sheet-title" id="sheetTitle">' + escapeHTML(e.name) + '</h2>' + sub +
        '<ol class="questions">' + qs + '</ol>' +
        '<div class="navbtns">' +
          '<button data-go="' + (prev ?? '') + '"' + (prev ? '' : ' disabled') + '>\u2190 Previous</button>' +
          '<button data-go="' + (next ?? '') + '"' + (next ? '' : ' disabled') + '>Next \u2192</button>' +
        '</div>' +
      '</div>';
  }
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  location.hash = n;
  sheet.querySelector('.close').addEventListener('click', closeEntry);
  sheet.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { if (b.dataset.go) openEntry(+b.dataset.go); }));
}

function closeEntry() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  current = null;
  history.replaceState(null, '', location.pathname + location.search);
}

overlay.addEventListener('click', e => { if (e.target === overlay) closeEntry(); });
document.addEventListener('keydown', e => {
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'Escape') closeEntry();
  if (e.key === 'ArrowRight') { const n = hasNext(current); if (n) openEntry(n); }
  if (e.key === 'ArrowLeft')  { const p = hasPrev(current); if (p) openEntry(p); }
});

const start = parseInt(location.hash.replace('#',''), 10);
if (start >= 1 && start <= TOTAL) openEntry(start);
</script>
